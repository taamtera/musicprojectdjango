<!-- Shared Filtering & Sorting Component -->
<div class="glass-panel p-4 mb-6 flex flex-wrap gap-4 items-center">
    <form method="get" class="flex gap-4 w-full">
        <!-- Search Input -->
        <div class="relative flex-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
            <input type="text" name="title" placeholder="Search by Title, Genre, or Description..." value="{{ request.GET.title }}" 
                   class="w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-white focus:outline-none focus:border-purple-500 transition-all">
        </div>

        <!-- Sort Dropdown -->
        <div class="relative min-w-[200px]">
            <select name="sort" onchange="this.form.submit()" 
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white appearance-none focus:outline-none focus:border-purple-500 cursor-pointer">
                <option value="-created_at" {% if request.GET.sort == '-created_at' %}selected{% endif %}>Newest First</option>
                <option value="created_at" {% if request.GET.sort == 'created_at' %}selected{% endif %}>Oldest First</option>
                <option value="title" {% if request.GET.sort == 'title' %}selected{% endif %}>Title (A-Z)</option>
                <option value="-title" {% if request.GET.sort == '-title' %}selected{% endif %}>Title (Z-A)</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
        </div>

        <!-- Submit (Hidden if using onchange, but good for manual enter) -->
        <button type="submit" class="hidden">Apply</button>
    </form>
</div>
