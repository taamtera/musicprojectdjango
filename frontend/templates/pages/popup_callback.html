<!DOCTYPE html>
<html>
<head>
    <title>Logging in...</title>
</head>
<body>
    <p>Authentication successful. You can close this window.</p>
    <script>
        const postLoginPath = '/songs/';

        if (window.opener && !window.opener.closed) {
            // Force a hard navigation so authenticated state is reflected immediately.
            window.opener.location.replace(postLoginPath);
            setTimeout(() => {
                try {
                    window.opener.location.reload();
                } catch (e) {
                    // Ignore reload failures; replace already navigated the opener.
                }
                window.close();
            }, 100);
        } else {
            window.location.replace(postLoginPath);
        }
    </script>
</body>
</html>
