<!-- Messages -->
{% if messages %}
<div class="container mx-auto px-4 mt-4">
    {% for message in messages %}
    <div class="p-4 rounded-lg {% if message.tags == 'success' %}bg-green-500/20 text-green-400{% else %}bg-red-500/20 text-red-400{% endif %} border border-current mb-4">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
