<div id="footer-player" class="w-full max-w-[1504px] mx-auto p-4 glass-panel border border-white/10 rounded-2xl shadow-2xl transition-all duration-500 relative overflow-hidden isolate">
    {% include "components/visualizer.html" %}

    <div class="relative z-10 w-full flex items-center justify-between gap-4">
    <!-- Song Info -->
    <div class="flex items-center gap-3 min-w-24 w-auto">
        <div id="player-icon" class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-slate-600 shadow-lg transition-all duration-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
        </div>
        <div class="truncate">
            <div id="footer-player-title" class="text-sm font-bold text-slate-500 truncate">No track selected</div>
            <div id="footer-player-genre" class="text-[10px] text-slate-600 truncate">Choose a song to start playing</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex-grow flex items-center gap-3">
        <button id="play-pause-btn" class="w-10 h-10 bg-purple-600 hover:bg-purple-500 text-white rounded-full flex items-center justify-center transition-colors flex-shrink-0" onclick="togglePlayPause()">
            <svg id="play-icon" class="h-5 w-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="pause-icon" class="h-5 w-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
            </svg>
        </button>

        <div class="flex-grow flex items-center gap-2">
            <span id="current-time" class="text-[10px] text-slate-500 w-10 text-right">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0"
                class="flex-grow h-2 bg-slate-700 rounded-full appearance-none cursor-pointer hover:bg-slate-600 transition-colors"
                style="accent-color: #a855f7;">
            <span id="duration-time" class="text-[10px] text-slate-500 w-10">0:00</span>
        </div>
    </div>

    <!-- Volume -->
    <div class="flex items-center gap-2 w-32 shrink-0">
        <svg class="h-4 w-4 text-slate-500" fill="currentColor" viewBox="0 0 24 24">
            <path d="M13.5 4.06c0-1.336-1.616-2.256-2.73-1.72l-5.24 3.02C5.1 5.395 4.3 6.25 4.3 7.26v9.48c0 1.01.8 1.865 1.73 2.12l5.24 3.02c1.11.536 2.73-.384 2.73-1.72V4.06z"/>
        </svg>
        <input type="range" id="volume-slider" min="0" max="100" value="70"
            class="flex-grow h-1 bg-slate-700 rounded-full appearance-none cursor-pointer hover:bg-slate-600 transition-colors"
            style="accent-color: #a855f7;">
    </div>

    <!-- Branding -->
    <div class="w-24 shrink-0 text-right">
        <p id="branding-title" class="text-[10px] font-bold text-slate-500">CHITHARA AI</p>
        <p class="text-[8px] text-slate-600 uppercase">© 2026 Generator</p>
    </div>
    </div>

    <audio id="global-audio" crossorigin="anonymous"></audio>
</div>

<script>
const globalAudio = document.getElementById('global-audio');
const playerTitle = document.getElementById('footer-player-title');
const playerGenre = document.getElementById('footer-player-genre');
const playerIcon = document.getElementById('player-icon');
const brandingTitle = document.getElementById('branding-title');
const playIcon = document.getElementById('play-icon');
const pauseIcon = document.getElementById('pause-icon');
const progressBar = document.getElementById('progress-bar');
const currentTimeEl = document.getElementById('current-time');
const durationTimeEl = document.getElementById('duration-time');
const volumeSlider = document.getElementById('volume-slider');

let isSeeking = false;
let audioContext = null;

function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function togglePlayPause() {
    ensureVisualizer();
    globalAudio.paused ? globalAudio.play() : globalAudio.pause();
}

globalAudio.addEventListener('play', () => {
    ensureVisualizer();
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }

    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
});

globalAudio.addEventListener('pause', () => {
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
});

// Update progress normally
globalAudio.addEventListener('timeupdate', () => {
    if (globalAudio.duration) {
        progressBar.value = (globalAudio.currentTime / globalAudio.duration) * 100;
    }
    currentTimeEl.textContent = formatTime(globalAudio.currentTime);
});

// Set duration
globalAudio.addEventListener('loadedmetadata', () => {
    durationTimeEl.textContent = formatTime(globalAudio.duration);
});

// ✅ Smooth seeking (no flags, no reset bug)
progressBar.addEventListener('input', () => {
    if (!globalAudio.duration) return;

    const newTime = (progressBar.value / 100) * globalAudio.duration;
    globalAudio.currentTime = newTime;

    // Update UI instantly while dragging
    currentTimeEl.textContent = formatTime(newTime);
});

volumeSlider.addEventListener('input', () => {
    globalAudio.volume = volumeSlider.value / 100;
});

globalAudio.volume = volumeSlider.value / 100;

function playSong(url, title, genre, cardId) {
    if (!url) return;

    ensureVisualizer();

    playerTitle.textContent = title;
    playerGenre.textContent = genre;

    playerTitle.classList.replace('text-slate-500', 'text-white');
    playerGenre.classList.replace('text-slate-600', 'text-slate-400');

    playerIcon.className = "w-10 h-10 rounded-lg flex items-center justify-center text-white shadow-lg bg-gradient-to-br from-purple-500 to-blue-500 pulse-ring";

    brandingTitle.classList.replace('text-slate-500', 'text-purple-400');

    globalAudio.src = url;
    globalAudio.play();

    document.querySelectorAll('.song-card')
        .forEach(c => c.classList.remove('border-purple-500', 'bg-purple-900/10'));

    const activeCard = document.getElementById(cardId);
    if (activeCard) {
        activeCard.classList.add('border-purple-500', 'bg-purple-900/10');
    }
}
</script>
